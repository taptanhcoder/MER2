study:
  name: text_phobert_base_ce_optuna
  storage: null
  direction: maximize
  sampler:
    name: tpe
    seed: 2026
    multivariate: true
  pruner:
    name: median
    n_startup_trials: 8
    n_warmup_steps: 1
    interval_steps: 1

search:
  base_experiment: configs/text/experiments/phobert_base_ce.yaml
  objective_metric: valid_macro_f1

  stage_a:
    enabled: true
    n_trials: 32
    seeds: [42]
    output_root: outputs/optuna/text/stage_a
    top_k_for_stage_b: 6
    std_penalty: 0.0

  stage_b:
    enabled: true
    seeds: [42, 52, 62, 72, 82]
    output_root: outputs/optuna/text/stage_b
    std_penalty: 0.25

space:
  finetune.unfreeze_top_k_layers:
    type: categorical
    choices: [0, 1, 2, 3, 4]

  model.classifier_hidden_dim:
    type: categorical
    choices: [64, 128, 256]

  model.classifier_dropout:
    type: categorical
    choices: [0.15, 0.20, 0.25, 0.30, 0.35]

  optimizer.lr:
    type: float
    low: 5.0e-6
    high: 3.0e-5
    log: true

  optimizer.weight_decay:
    type: float
    low: 0.005
    high: 0.10
    log: true

  scheduler.warmup_ratio:
    type: categorical
    choices: [0.0, 0.05, 0.10, 0.15, 0.20]

  train.epochs:
    type: categorical
    choices: [12, 15, 20]

  early_stopping.patience:
    type: categorical
    choices: [3, 4, 5]

  loss.name:
    type: categorical
    choices: [cross_entropy, weighted_cross_entropy, focal]

  loss.label_smoothing:
    type: categorical
    choices: [0.0, 0.05, 0.10]

  tokenizer.max_length:
    type: categorical
    choices: [64, 128, 192]

  preprocessing.word_segment:
    type: categorical
    choices: [true, false]