study:
  name: text_phobert_base_ce_optuna
  storage: null
  direction: maximize
  sampler:
    name: tpe
    seed: 2026
    multivariate: true
  pruner:
    name: median
    n_startup_trials: 8
    n_warmup_steps: 4
    interval_steps: 1

search:
  base_experiment: configs/text/experiments/phobert_base_ce.yaml
  objective_metric: valid_macro_f1

  stage_a:
    enabled: true
    n_trials: 24
    seed: 42
    output_root: outputs/optuna/text/stage_a
    top_k_for_stage_b: 5

  stage_b:
    enabled: true
    seeds: [42, 52, 62]
    output_root: outputs/optuna/text/stage_b
    std_penalty: 0.25

space:
  finetune.unfreeze_top_k_layers:
    type: categorical
    choices: [3, 4]

  optimizer.lr:
    type: float
    low: 1.7e-5
    high: 2.5e-5
    log: true

  model.classifier_dropout:
    type: float
    low: 0.08
    high: 0.18
    step: 0.02

  optimizer.weight_decay:
    type: float
    low: 0.005
    high: 0.03
    log: false

  scheduler.warmup_ratio:
    type: float
    low: 0.05
    high: 0.15
    step: 0.01