experiment:
  name: text_phobert_base_ce_top3

defaults:
  - configs/dataset/common_mer5.yaml
  - configs/dataset/vnemos_text_train.yaml
  - configs/text/base/text_base.yaml
  - configs/text/models/phobert_base.yaml

finetune:
  freeze_embeddings: true
  train_full_encoder: false
  unfreeze_top_k_layers: 3

loss:
  name: cross_entropy

seed: 42