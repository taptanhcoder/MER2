experiment:
  name: fusion_light_bica_gate_v2

defaults:
  - configs/dataset/common_mer5.yaml
  - configs/fusion/base/fusion_base.yaml
  - configs/fusion/model/light_bica_gate.yaml

dataset:
  text_export_dir: outputs/fusion_exports/text
  speech_export_dir: outputs/fusion_exports/speech

  fusion_artifacts:
    train: outputs/fusion_artifacts/train.pt
    valid: outputs/fusion_artifacts/valid.pt
    test: outputs/fusion_artifacts/test.pt

  calibration:
    text: outputs/runs/text/text_phobert_base_ce/seed_42/calibration/temperature_scaling.json
    speech: outputs/runs/speech/speech_hubert_base_attn_freeze_ce/seed_42/calibration/temperature_scaling.json

train:
  batch_size: 16
  epochs: 40
  grad_clip_norm: 1.0
  grad_accum_steps: 1

optimizer:
  name: adamw
  lr: 2.0e-4
  weight_decay: 0.01

scheduler:
  name: linear_warmup
  warmup_ratio: 0.1

early_stopping:
  enabled: true
  patience: 6
  min_delta: 0.0
  monitor: macro_f1
  mode: max

checkpoint:
  monitor: macro_f1
  mode: max

evaluation:
  primary_metric: macro_f1

dominance:
  use_modality_dropout: true
  text_dropout_prob: 0.05
  speech_dropout_prob: 0.05
  use_dominance_regularizer: true
  lambda_text: 0.10
  lambda_speech: 0.10

output:
  save_confusion_matrix: true
  save_classification_report: true