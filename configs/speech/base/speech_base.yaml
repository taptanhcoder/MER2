task: speech_classification

audio:
  sample_rate: 16000
  mono: true
  max_duration_sec: 8.0
  num_train_views: 2
  num_eval_views: 3

augment: {}

train:
  batch_size: 8
  epochs: 20
  grad_clip_norm: 1.0
  grad_accum_steps: 2

optimizer:
  name: adamw
  lr: 1.0e-5
  weight_decay: 0.01

scheduler:
  name: linear_warmup
  warmup_ratio: 0.1

early_stopping:
  enabled: true
  patience: 5
  min_delta: 0.0
  monitor: macro_f1
  mode: max

evaluation:
  primary_metric: macro_f1
  save_predictions: true
  save_logits: true

output:
  save_classification_report: true
  save_confusion_matrix: true
  max_error_rows: 200